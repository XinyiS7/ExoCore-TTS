[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "exocore-tts"
version = "0.1.0"
description = "Local voice factory for ExoCore: one loopback TTS port with swappable local/cloud backends"
readme = "README.md"
requires-python = ">=3.10"
# 只放「跑工具和契约层」需要的轻依赖。
# 重型/版本敏感的推理栈（torch/voxcpm）一律走本服务自己的 conda 环境 + extras，
# 绝不进 ExoCore/requirements.txt。
dependencies = [
    "soundfile>=0.12",
]

[project.optional-dependencies]
server = ["fastapi>=0.115,<1", "pydantic>=2.10,<3", "uvicorn>=0.30,<1"]
voxcpm2 = ["voxcpm>=2.0,<3"]

[project.scripts]
exocore-cast = "exocore_tts.casting:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
